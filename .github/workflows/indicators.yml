name: איסוף אינדיקטורים

# התהליך היחיד שמריץ את האינדיקטורים (דף "אינדיקטורים"). הוצא מהאיסוף הראשי
# (collect.yml) ב-09.11.2026: שם כל הפעלה של השעון בקלאודפלר ביטלה את הקודמת,
# והאינדיקטורים לא הספיקו להסתיים מאז 27.10. כאן יש קבוצת ריצה נפרדת.
# פעמיים ביום, בשעון UTC: אחרי סגירת אירופה ואחרי סגירת וול סטריט.
# הנתונים יומיים/חודשיים, כך שאין טעם בתדירות גבוהה יותר.
# פרמיית הסיכון נשענת על market/summary.json, שהאיסוף הראשי מעדכן כל חצי שעה.
on:
  schedule:
    - cron: '47 17 * * *'
    - cron: '47 21 * * *'
  workflow_dispatch: {}

concurrency:
  group: indicators-only
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  indicators:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: שליפת הקוד
        uses: actions/checkout@v4
      - name: התקנת Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: התקנת תלויות
        run: npm ci
      - name: איסוף אינדיקטורים
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # מפתח חינמי של FRED. בלעדיו הסקריפט חוזר לקובץ הגרף, שחסום לשרתי גיטהאב
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node collector/indicators.mjs
