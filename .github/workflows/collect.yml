name: איסוף נתונים ממאיה

on:
  # המפעיל הראשי: Worker בקלאודפלר (worker/collector-cron.js) שולח הפעלה כל 15 דקות.
  # כל הפעלה = סבב איסוף אחד, קצר. ה-schedule כאן הוא גיבוי בלבד, אם ה-Worker נופל.
  # (עד 09.11.2026 כאן רצה לולאה של 5.5 שעות; כל הפעלה של ה-Worker ביטלה את
  # הקודמת אחרי 15 דקות, ושלב האינדיקטורים לא הסתיים מאז 27.10.)
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch: {} # מאפשר גם הרצה ידנית בלחיצת כפתור מ-GitHub

# ריצה אחת בכל רגע. סבב שמתארך לא נקטע: ההפעלה הבאה ממתינה בתור,
# ו-GitHub שומר בתור הפעלה ממתינה אחת בלבד (חדשה מחליפה ישנה שטרם התחילה).
concurrency:
  group: collector
  cancel-in-progress: false

# נדרש לשלב "שמירה בחיים" — הפעלה מחדש של ה-workflows דרך ה-API
permissions:
  contents: read
  actions: write

jobs:
  collect:
    # נעוץ ל-24.04: מ-30.10.2026 ubuntu-latest עבר לאובונטו 26, ושם התקנת
    # תלויות הדפדפן של Playwright נכשלת — כל ריצות מאיה נפלו בשלב ההתקנה.
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # סבב אחד; סבב תקוע לא יחסום את התור יותר מחצי שעה
    steps:
      # GitHub מכבה אוטומטית schedule בריפו ציבורי אחרי 60 יום בלי commit
      # (קרה ב-06.10.2026 — הפיד קפא 8 ימים). הפעלה מחדש דרך ה-API מאפסת
      # את מונה חוסר הפעילות, כך שכל ריצה שומרת את שלושת ה-workflows בחיים.
      - name: שמירה בחיים (מניעת כיבוי אחרי 60 יום)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in collect.yml collect-news.yml indicators.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" && echo "✅ $wf פעיל" || echo "⚠️ הפעלת $wf נכשלה — ממשיכים"
          done

      - name: שליפת הקוד
        uses: actions/checkout@v4

      - name: התקנת Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: התקנת תלויות
        run: npm ci

      # קאש לדפדפן Playwright — חוסך ~2-3 דקות הורדה בכל ריצה
      - name: קאש דפדפן Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      # עד 3 ניסיונות: התקלה הנפוצה כאן היא הורדה חולפת ממאגר החבילות של אובונטו
      # (קרה ב-21.10.2026, ריצה #12465) — לא באג. המתנה הולכת וגדלה בין ניסיונות.
      - name: התקנת דפדפן Playwright
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            CMD="npx playwright install-deps chromium"
          else
            CMD="npx playwright install --with-deps chromium"
          fi
          for i in 1 2 3; do
            $CMD && exit 0
            echo "⚠️ ניסיון $i להתקנת הדפדפן נכשל"
            [ $i -lt 3 ] && sleep $((i * 30)) && sudo apt-get update -qq || true
          done
          echo "⛔ התקנת הדפדפן נכשלה 3 פעמים"; exit 1

      - name: סבב איסוף
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          MODEL_DEAD=0 # קוד יציאה 3 = מודל ה-AI הוסר מהשירות (ראה flagDeadModel)
          node collector/run.mjs || { [ $? -eq 3 ] && MODEL_DEAD=1; echo "⚠️ סבב מאיה נכשל — ממשיכים"; }
          node collector/run-news.mjs || { [ $? -eq 3 ] && MODEL_DEAD=1; echo "⚠️ סבב חדשות נכשל — ממשיכים"; }
          # סיכום מסחר (דף "שווקים") — כל חצי שעה, ברבע הראשון והשלישי של השעה:
          # כ-200 בקשות לאתר הבורסה, ונתוני סוף-יום ממילא לא משתנים מהר.
          # האינדיקטורים כבר לא כאן — הם בתהליך נפרד, indicators.yml.
          QUARTER=$(( 10#$(date -u +%M) / 15 ))
          if [ $((QUARTER % 2)) -eq 0 ]; then
            node collector/markets.mjs || echo "⚠️ סיכום מסחר נכשל — ממשיכים"
          else
            echo "⏭️ סיכום מסחר — לא ברבע שעה הזה"
          fi
          # השלמת שורות תחתונות לפריטים ישנים. האספן שולף רק ~יום אחורה ולכן
          # לעולם לא יחזור אליהם לבד. רץ אחרון בכוונה: הידיעות הטריות מקבלות
          # את מכסת Groq קודם, וההשלמה לוקחת רק את מה שנשאר ועוצרת מיד כשאין.
          # שני מעברים: חשיבות עליונה (8+) תמיד ראשונה — כרטיס בציון 9 בלי
          # שורת הסבר הוא הכישלון הבולט ביותר בפיד — ורק אחריה השאר.
          node collector/backfill-bottomlines.mjs --min 8 --limit 6 --quick --apply || echo "⚠️ השלמה (8+) נכשלה — ממשיכים"
          node collector/backfill-bottomlines.mjs --limit 6 --quick --apply || echo "⚠️ השלמה נכשלה — ממשיכים"
          echo "✅ הסבב הסתיים"
          # האיסוף עצמו עבד, אבל בלי AI אין שורות תחתונות — מכשילים כדי שתישלח התראה
          if [ $MODEL_DEAD -eq 1 ]; then echo "⛔ מודל ה-AI לא קיים — יש להחליף ב-signal.mjs"; exit 1; fi
