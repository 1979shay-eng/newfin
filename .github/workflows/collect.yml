name: איסוף נתונים ממאיה

on:
  schedule:
    # אסטרטגיית "ריצה מתמשכת": ה-scheduler של GitHub לא אמין (מעיר כל 2.5-4.5 שעות
    # בפועל). לכן כל ריצה נשארת חיה ~5.5 שעות ואוספת בלולאה כל 10 דקות.
    # כך מספיקות 4-5 התעוררויות ביום לכיסוי מלא — בלי PAT ובלי שעון חיצוני.
    # ה-concurrency מבטיח שריצה חדשה לא תרוץ במקביל לקיימת.
    - cron: '7 */3 * * *'
  workflow_dispatch: {} # מאפשר גם הרצה ידנית בלחיצת כפתור מ-GitHub

# ריצה אחת בלבד בכל רגע; חדשה מבטלת את הישנה (שכבר קרובה לסוף חייה)
concurrency:
  group: collector
  cancel-in-progress: true

# נדרש לשלב "שמירה בחיים" — הפעלה מחדש של ה-workflows דרך ה-API
permissions:
  contents: read
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # מתחת למגבלת 6 שעות של GitHub
    steps:
      # GitHub מכבה אוטומטית schedule בריפו ציבורי אחרי 60 יום בלי commit
      # (קרה ב-06.10.2026 — הפיד קפא 8 ימים). הפעלה מחדש דרך ה-API מאפסת
      # את מונה חוסר הפעילות, כך שכל ריצה שומרת את שני ה-workflows בחיים.
      - name: שמירה בחיים (מניעת כיבוי אחרי 60 יום)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in collect.yml collect-news.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" && echo "✅ $wf פעיל" || echo "⚠️ הפעלת $wf נכשלה — ממשיכים"
          done

      - name: שליפת הקוד
        uses: actions/checkout@v4

      - name: התקנת Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: התקנת תלויות
        run: npm ci

      # קאש לדפדפן Playwright — חוסך ~2-3 דקות הורדה בכל ריצה
      - name: קאש דפדפן Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      # עד 3 ניסיונות: התקלה הנפוצה כאן היא הורדה חולפת ממאגר החבילות של אובונטו
      # (קרה ב-21.10.2026, ריצה #12465) — לא באג. המתנה הולכת וגדלה בין ניסיונות.
      - name: התקנת דפדפן Playwright
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            CMD="npx playwright install-deps chromium"
          else
            CMD="npx playwright install --with-deps chromium"
          fi
          for i in 1 2 3; do
            $CMD && exit 0
            echo "⚠️ ניסיון $i להתקנת הדפדפן נכשל"
            [ $i -lt 3 ] && sleep $((i * 30)) && sudo apt-get update -qq || true
          done
          echo "⛔ התקנת הדפדפן נכשלה 3 פעמים"; exit 1

      - name: לולאת איסוף (כל 10 דקות, עד ~5.5 שעות)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          END=$((SECONDS + 19800))  # 5.5 שעות
          CYCLE=0
          MODEL_DEAD=0 # קוד יציאה 3 = מודל ה-AI הוסר מהשירות (ראה flagDeadModel)
          while [ $SECONDS -lt $END ]; do
            CYCLE=$((CYCLE + 1))
            echo "════════ סבב איסוף #$CYCLE ════════"
            node collector/run.mjs || { [ $? -eq 3 ] && MODEL_DEAD=1; echo "⚠️ סבב מאיה #$CYCLE נכשל — ממשיכים"; }
            node collector/run-news.mjs || { [ $? -eq 3 ] && MODEL_DEAD=1; echo "⚠️ סבב חדשות #$CYCLE נכשל — ממשיכים"; }
            # סיכום מסחר (דף "שווקים") — כל סבב שלישי (~חצי שעה): כ-200 בקשות לאתר
            # הבורסה, ונתוני סוף-יום ממילא לא משתנים מהר. הסבב הראשון תמיד רץ.
            if [ $((CYCLE % 3)) -eq 1 ]; then
              node collector/markets.mjs || echo "⚠️ סיכום מסחר #$CYCLE נכשל — ממשיכים"
            fi
            # השלמת שורות תחתונות לפריטים ישנים. האספן שולף רק ~יום אחורה ולכן
            # לעולם לא יחזור אליהם לבד. רץ אחרון בכוונה: הידיעות הטריות מקבלות
            # את מכסת Groq קודם, וההשלמה לוקחת רק את מה שנשאר ועוצרת מיד כשאין.
            # שני מעברים: חשיבות עליונה (8+) תמיד ראשונה — כרטיס בציון 9 בלי
            # שורת הסבר הוא הכישלון הבולט ביותר בפיד — ורק אחריה השאר.
            node collector/backfill-bottomlines.mjs --min 8 --limit 6 --quick --apply || echo "⚠️ השלמה (8+) #$CYCLE נכשלה — ממשיכים"
            node collector/backfill-bottomlines.mjs --limit 6 --quick --apply || echo "⚠️ השלמה #$CYCLE נכשלה — ממשיכים"
            # אם נשאר פחות מ-10 דקות לסוף — לא שווה לישון, מסיימים
            REMAIN=$((END - SECONDS))
            if [ $REMAIN -lt 600 ]; then break; fi
            echo "😴 המתנה 10 דקות לסבב הבא ($((REMAIN / 60)) דק' נותרו לריצה)..."
            sleep 600
          done
          echo "✅ הריצה המתמשכת הסתיימה אחרי $CYCLE סבבים"
          # האיסוף עצמו עבד, אבל בלי AI אין שורות תחתונות — מכשילים כדי שתישלח התראה
          if [ $MODEL_DEAD -eq 1 ]; then echo "⛔ מודל ה-AI לא קיים — יש להחליף ב-signal.mjs"; exit 1; fi
