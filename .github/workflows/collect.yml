name: איסוף נתונים ממאיה

on:
  schedule:
    # אסטרטגיית "ריצה מתמשכת": ה-scheduler של GitHub לא אמין (מעיר כל 2.5-4.5 שעות
    # בפועל). לכן כל ריצה נשארת חיה ~5.5 שעות ואוספת בלולאה כל 10 דקות.
    # כך מספיקות 4-5 התעוררויות ביום לכיסוי מלא — בלי PAT ובלי שעון חיצוני.
    # ה-concurrency מבטיח שריצה חדשה לא תרוץ במקביל לקיימת.
    - cron: '7 */3 * * *'
  workflow_dispatch: {} # מאפשר גם הרצה ידנית בלחיצת כפתור מ-GitHub

# ריצה אחת בלבד בכל רגע; חדשה מבטלת את הישנה (שכבר קרובה לסוף חייה)
concurrency:
  group: collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # מתחת למגבלת 6 שעות של GitHub
    steps:
      - name: שליפת הקוד
        uses: actions/checkout@v4

      - name: התקנת Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: התקנת תלויות
        run: npm ci

      # קאש לדפדפן Playwright — חוסך ~2-3 דקות הורדה בכל ריצה
      - name: קאש דפדפן Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: התקנת דפדפן Playwright
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: לולאת איסוף (כל 10 דקות, עד ~5.5 שעות)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          END=$((SECONDS + 19800))  # 5.5 שעות
          CYCLE=0
          while [ $SECONDS -lt $END ]; do
            CYCLE=$((CYCLE + 1))
            echo "════════ סבב איסוף #$CYCLE ════════"
            node collector/run.mjs || echo "⚠️ סבב מאיה #$CYCLE נכשל — ממשיכים"
            node collector/run-news.mjs || echo "⚠️ סבב חדשות #$CYCLE נכשל — ממשיכים"
            # השלמת שורות תחתונות לפריטים ישנים. האספן שולף רק ~יום אחורה ולכן
            # לעולם לא יחזור אליהם לבד. רץ אחרון בכוונה: הידיעות הטריות מקבלות
            # את מכסת Groq קודם, וההשלמה לוקחת רק את מה שנשאר ועוצרת מיד כשאין.
            node collector/backfill-bottomlines.mjs --limit 8 --quick --apply || echo "⚠️ השלמת שורות תחתונות #$CYCLE נכשלה — ממשיכים"
            # אם נשאר פחות מ-10 דקות לסוף — לא שווה לישון, מסיימים
            REMAIN=$((END - SECONDS))
            if [ $REMAIN -lt 600 ]; then break; fi
            echo "😴 המתנה 10 דקות לסבב הבא ($((REMAIN / 60)) דק' נותרו לריצה)..."
            sleep 600
          done
          echo "✅ הריצה המתמשכת הסתיימה אחרי $CYCLE סבבים"
